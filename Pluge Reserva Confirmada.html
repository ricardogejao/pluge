<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pluge — Reserva confirmada</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="app/pluge-tokens.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); background: #050505; background-image: radial-gradient(80% 60% at 50% 0%, #141414 0%, #050505 70%); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  #root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .device-scaler { transform-origin: center center; }
  .device { position: relative; width: 393px; height: 852px; flex: none; }
  .device .bezel { position: absolute; inset: 0; border-radius: 54px; background: #0A0A0A; overflow: hidden; box-shadow: 0 0 0 11px #161616, 0 0 0 12px #2c2c2c, 0 40px 120px rgba(0,0,0,.6); }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 124px; height: 35px; border-radius: 20px; background: #000; z-index: 40; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-primary); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); z-index: 45; }
  .statusbar { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 34px; }
  .statusbar .time { font-size: 15px; font-weight: 600; }
  .statusbar .icons { display: flex; gap: 7px; align-items: center; }
  .content { flex: 1; overflow-y: auto; padding: 10px 22px 16px; }
  .content::-webkit-scrollbar { display: none; }

  .check-wrap { display: flex; justify-content: center; padding: 16px 0 0; }
  .check-ring { width: 84px; height: 84px; border-radius: 50%; background: var(--color-primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 9px var(--fill-primary), 0 12px 32px rgba(0,212,106,.32); }
  @media (prefers-reduced-motion: no-preference) { .check-ring { animation: pop .5s cubic-bezier(.2,0,0,1); } }
  @keyframes pop { 0% { transform: scale(.75); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
  h1.title { font-size: 25px; font-weight: 700; letter-spacing: -.6px; text-align: center; margin: 20px 0 0; }
  .subtitle { text-align: center; color: var(--text-secondary); font-size: 14px; margin-top: 7px; }

  .card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; margin-top: 24px; }
  .chargerrow { display: flex; align-items: center; gap: 13px; }
  .av { position: relative; width: 48px; height: 48px; flex: none; }
  .av .c { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-surface-2); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600; }
  .av .tk { position: absolute; right: -2px; bottom: -2px; width: 19px; height: 19px; border-radius: 50%; background: var(--color-primary); display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-surface); }
  .nm { font-size: 16px; font-weight: 600; }
  .sb { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .when { display: flex; gap: 14px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .when .f { flex: 1; }
  .when .k { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--text-tertiary); }
  .when .k i { font-size: 14px; }
  .when .v { font-size: 15px; font-weight: 500; margin-top: 7px; }
  .codepill { display: flex; align-items: center; gap: 9px; margin-top: 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 13px 15px; }
  .codepill i { font-size: 18px; color: var(--color-primary); }
  .codepill .t { font-size: 13px; color: var(--text-secondary); }
  .codepill b { color: #fff; font-weight: 600; }
  .footer { flex: none; padding: 12px 22px 22px; display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<div id="root">
  <div class="device-scaler" id="scaler">
    <div class="device">
      <div class="bezel">
        <div class="island"></div>
        <div class="screen">
          <div class="statusbar">
            <span class="time">13:42</span>
            <span class="icons"><i class="ti ti-signal-4g" style="font-size:17px"></i><i class="ti ti-wifi" style="font-size:17px"></i><i class="ti ti-battery-3" style="font-size:20px"></i></span>
          </div>
          <div class="content">
            <div class="check-wrap">
              <div class="check-ring"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg></div>
            </div>
            <h1 class="title">Reserva confirmada!</h1>
            <div class="subtitle">Renata foi avisada · faça o check-in na chegada</div>

            <div class="card">
              <div class="chargerrow">
                <div class="av"><div class="c">R</div><div class="tk"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"></path></svg></div></div>
                <div style="flex:1;min-width:0"><div class="nm">Renata Oliveira</div><div class="sb">Cambuí · Tipo 2 · 7,4 kW</div></div>
                <span class="badge badge-reserved">Reservado</span>
              </div>
              <div class="when">
                <div class="f"><div class="k"><i class="ti ti-calendar-event"></i>Data</div><div class="v">Quinta, 15 de junho</div></div>
                <div class="f"><div class="k"><i class="ti ti-clock"></i>Horário</div><div class="v">14:00 – 17:00</div></div>
              </div>
              <div class="codepill"><i class="ti ti-qrcode"></i><span class="t">Plug <b>#RO-247</b> · escaneie ao chegar</span></div>
            </div>
          </div>
          <div class="footer">
            <button class="btn btn-primary btn-block btn-lg" data-nav="checkin"><i class="ti ti-qrcode"></i>Fazer check-in agora</button>
            <button class="btn btn-secondary btn-block" data-nav="map">Voltar ao mapa</button>
          </div>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
</div>
<script>
  (function () {
    var scaler = document.getElementById("scaler");
    function fit() { var s = Math.min(1, (window.innerHeight - 24) / 852, (window.innerWidth - 24) / 393); scaler.style.transform = "scale(" + s + ")"; }
    fit(); window.addEventListener("resize", fit);
  })();
</script>
<script src="app/embed.js"></script>
</body>
</html>
