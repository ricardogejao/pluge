<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pluge — Perfil</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="app/pluge-tokens.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); background: #050505; background-image: radial-gradient(80% 60% at 50% 0%, #141414 0%, #050505 70%); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  #root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .device-scaler { transform-origin: center center; }
  .device { position: relative; width: 393px; height: 852px; flex: none; }
  .device .bezel { position: absolute; inset: 0; border-radius: 54px; background: #0A0A0A; overflow: hidden; box-shadow: 0 0 0 11px #161616, 0 0 0 12px #2c2c2c, 0 40px 120px rgba(0,0,0,.6); }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 124px; height: 35px; border-radius: 20px; background: #000; z-index: 40; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-primary); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); z-index: 45; }

  .content { flex: 1; overflow-y: auto; padding: 56px 18px 14px; }
  .content::-webkit-scrollbar { display: none; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .backbtn { width: 38px; height: 38px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer; }
  .backbtn i { font-size: 20px; color: #fff; }

  .me { display: flex; align-items: center; gap: 14px; }
  .me .av { width: 64px; height: 64px; border-radius: 50%; background: var(--bg-surface-2); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 600; flex: none; }
  .me .nm { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
  .me .rt { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .me .rt i { color: var(--color-warning); font-size: 14px; }
  .me .rt b { color: #fff; font-weight: 600; }

  .host-cta { margin-top: 22px; cursor: pointer; background: var(--bg-surface); border: 1px solid rgba(139,92,246,.3); border-radius: var(--radius-lg); padding: 18px; display: flex; align-items: center; gap: 14px; }
  .host-cta .ic { width: 46px; height: 46px; border-radius: 13px; background: var(--fill-tertiary); display: flex; align-items: center; justify-content: center; flex: none; }
  .host-cta .ic i { font-size: 25px; color: var(--color-tertiary); }
  .host-cta .tt { font-size: 16px; font-weight: 600; }
  .host-cta .ss { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }
  .host-cta .arr { margin-left: auto; color: var(--color-tertiary); font-size: 20px; }

  .menu { margin-top: 16px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .mi { display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer; }
  .mi + .mi { border-top: 1px solid var(--border); }
  .mi > i.lead { font-size: 20px; color: var(--text-secondary); }
  .mi .lbl { flex: 1; font-size: 15px; }
  .mi .val { font-size: 13px; color: var(--text-tertiary); }
  .mi > i.arr { font-size: 18px; color: var(--text-tertiary); }

  .bottomnav { display: flex; border-top: 1px solid var(--border); background: var(--bg-primary); padding: 9px 0 26px; flex: none; }
  .bottomnav .item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-tertiary); cursor: pointer; }
  .bottomnav .item i { font-size: 24px; }
  .bottomnav .item span { font-size: 10px; font-weight: 500; }
  .bottomnav .item.on { color: var(--color-primary); }
  .bottomnav .item.on span { font-weight: 600; }
</style>
</head>
<body>
<div id="root">
  <div class="device-scaler" id="scaler">
    <div class="device">
      <div class="bezel">
        <div class="island"></div>
        <div class="screen">
          <div class="content">
            <div class="me">
              <div class="av">L</div>
              <div>
                <div class="nm">Lucas Trevisan</div>
                <div class="rt"><i class="ti ti-star-filled"></i><b>4,91</b> · 23 sessões · BYD Dolphin</div>
              </div>
            </div>

            <div class="host-cta" data-nav="addcharger">
              <div class="ic"><i class="ti ti-charging-pile"></i></div>
              <div><div class="tt">Quero ser Host</div><div class="ss">Disponibilize seu carregador e ganhe renda extra</div></div>
              <i class="ti ti-chevron-right arr"></i>
            </div>

            <div class="menu">
              <div class="mi"><i class="ti ti-credit-card lead"></i><span class="lbl">Pagamento</span><span class="val">•••• 4827</span><i class="ti ti-chevron-right arr"></i></div>
              <div class="mi"><i class="ti ti-history lead"></i><span class="lbl">Histórico de sessões</span><span class="val">23 cargas</span><i class="ti ti-chevron-right arr"></i></div>
              <div class="mi"><i class="ti ti-car lead"></i><span class="lbl">Meus veículos</span><span class="val">BYD Dolphin</span><i class="ti ti-chevron-right arr"></i></div>
              <div class="mi"><i class="ti ti-bell lead"></i><span class="lbl">Notificações</span><i class="ti ti-chevron-right arr"></i></div>
              <div class="mi"><i class="ti ti-help-circle lead"></i><span class="lbl">Ajuda e suporte</span><i class="ti ti-chevron-right arr"></i></div>
            </div>
          </div>
          <div class="bottomnav">
            <div class="item" data-nav="map"><i class="ti ti-search"></i><span>Busca</span></div>
            <div class="item" data-nav="historico"><i class="ti ti-history"></i><span>Histórico</span></div>
            <div class="item" data-nav="session"><i class="ti ti-bolt"></i><span>Sessões</span></div>
            <div class="item on" data-nav="profile"><i class="ti ti-user"></i><span>Perfil</span></div>
          </div>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
</div>
<script>
  (function () {
    var scaler = document.getElementById("scaler");
    function fit() { var s = Math.min(1, (window.innerHeight - 24) / 852, (window.innerWidth - 24) / 393); scaler.style.transform = "scale(" + s + ")"; }
    fit(); window.addEventListener("resize", fit);
  })();
</script>
<script src="app/embed.js"></script>
</body>
</html>
