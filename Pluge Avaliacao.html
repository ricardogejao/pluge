<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pluge — Avaliação</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="app/pluge-tokens.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    background: #050505;
    background-image: radial-gradient(80% 60% at 50% 0%, #141414 0%, #050505 70%);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  #root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .device-scaler { transform-origin: center center; }

  /* iPhone 14 Pro frame */
  .device { position: relative; width: 393px; height: 852px; flex: none; }
  .device .bezel {
    position: absolute; inset: 0; border-radius: 54px; background: #0A0A0A;
    overflow: hidden; box-shadow: 0 0 0 11px #161616, 0 0 0 12px #2c2c2c, 0 40px 120px rgba(0,0,0,.6);
  }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 124px; height: 35px; border-radius: 20px; background: #000; z-index: 40; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-primary); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); z-index: 45; }

  .statusbar { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px 0 34px; z-index: 20; }
  .statusbar .time { font-size: 15px; font-weight: 600; }
  .statusbar .icons { display: flex; gap: 7px; align-items: center; }

  .content { flex: 1; overflow-y: auto; padding: 16px 22px 16px; }
  .content::-webkit-scrollbar { display: none; }

  h1.title { font-size: 26px; font-weight: 700; letter-spacing: -.7px; margin: 8px 0 0; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 8px; }

  /* stars */
  .stars { display: flex; justify-content: center; gap: 12px; margin: 30px 0 8px; }
  .stars button { background: none; border: none; padding: 0; cursor: pointer; line-height: 0;
    transition: transform .12s cubic-bezier(.2,0,0,1); }
  .stars button:active { transform: scale(.9); }
  .stars svg { width: 42px; height: 42px; display: block; }

  /* chips */
  .section-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em;
    color: var(--text-tertiary); margin: 28px 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-size: 14px; font-weight: 500; padding: 11px 16px; border-radius: 999px;
    background: var(--bg-surface); color: var(--text-secondary);
    border: 1px solid var(--border); transition: all .15s cubic-bezier(.2,0,0,1); user-select: none; }
  .chip i { font-size: 16px; }
  .chip .plus { color: var(--text-tertiary); }
  .chip.on { background: var(--fill-primary); color: var(--color-primary); border-color: rgba(0,212,106,.4); }

  /* comment */
  .comment { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 16px 17px; margin-top: 14px; }
  .comment .ph { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em;
    color: var(--text-tertiary); display: flex; align-items: center; gap: 7px; margin-bottom: 11px; }
  .comment .ph i { font-size: 15px; }
  .comment p { margin: 0; font-size: 15px; line-height: 1.55; color: #fff; }
  .comment .cursor { display: inline-block; width: 2px; height: 17px; background: var(--color-primary);
    vertical-align: -3px; margin-left: 1px; }
  @media (prefers-reduced-motion: no-preference) { .comment .cursor { animation: blink 1.1s steps(1) infinite; } }
  @keyframes blink { 50% { opacity: 0; } }

  .footer { flex: none; padding: 14px 22px 24px; }
</style>
</head>
<body>
<div id="root">
  <div class="device-scaler" id="scaler">
    <div class="device">
      <div class="bezel">
        <div class="island"></div>
        <div class="screen">

          <div class="statusbar">
            <span class="time">15:03</span>
            <span class="icons">
              <i class="ti ti-signal-4g" style="font-size:17px"></i>
              <i class="ti ti-wifi" style="font-size:17px"></i>
              <i class="ti ti-battery-3" style="font-size:20px"></i>
            </span>
          </div>

          <div class="content">

            <h1 class="title">Como foi a experiência?</h1>
            <div class="subtitle">Sessão com Renata Oliveira · Cambuí</div>

            <!-- Stars -->
            <div class="stars" id="stars"></div>

            <!-- Chips -->
            <div class="section-label">O que se destacou</div>
            <div class="chips" id="chips"></div>

            <!-- Comment -->
            <div class="comment">
              <div class="ph"><i class="ti ti-message-2"></i>Seu comentário</div>
              <p>Garagem super bem sinalizada, processo foi fácil demais. A Renata ainda deixou uma marquise pra eu não me molhar enquanto conectava. Ótimo host, volto com certeza!<span class="cursor"></span></p>
            </div>

          </div>

          <!-- Footer -->
          <div class="footer">
            <button class="btn btn-primary btn-block btn-lg" data-nav="map|toast:Avaliação enviada!"><i class="ti ti-send"></i>Enviar avaliação</button>
          </div>

        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
</div>
<script>
  var STAR_ON = '<svg viewBox="0 0 24 24" fill="#FFB800"><path d="M12 2.5l2.9 6.06 6.6.78-4.87 4.5 1.28 6.52L12 17.6l-5.9 3.26 1.28-6.52L2.5 9.84l6.6-.78z"/></svg>';
  var STAR_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="#3a3a38" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5l2.9 6.06 6.6.78-4.87 4.5 1.28 6.52L12 17.6l-5.9 3.26 1.28-6.52L2.5 9.84l6.6-.78z"/></svg>';

  var rating = 5;
  var starsEl = document.getElementById("stars");
  function renderStars() {
    starsEl.innerHTML = "";
    for (var i = 1; i <= 5; i++) {
      var b = document.createElement("button");
      b.innerHTML = i <= rating ? STAR_ON : STAR_OFF;
      (function (n) { b.onclick = function () { rating = n; renderStars(); }; })(i);
      starsEl.appendChild(b);
    }
  }
  renderStars();

  var CHIPS = [
    { t: "Fácil de encontrar", on: true },
    { t: "Host atencioso", on: true },
    { t: "Carregador rápido", on: false },
    { t: "Garagem segura", on: true },
    { t: "Pontual", on: false },
  ];
  var chipsEl = document.getElementById("chips");
  function renderChips() {
    chipsEl.innerHTML = "";
    CHIPS.forEach(function (c, idx) {
      var el = document.createElement("span");
      el.className = "chip" + (c.on ? " on" : "");
      el.innerHTML = (c.on
        ? '<i class="ti ti-check"></i>'
        : '<i class="ti ti-plus plus"></i>') + c.t;
      el.onclick = function () { CHIPS[idx].on = !CHIPS[idx].on; renderChips(); };
      chipsEl.appendChild(el);
    });
  }
  renderChips();

  (function () {
    var scaler = document.getElementById("scaler");
    function fit() {
      var s = Math.min(1, (window.innerHeight - 24) / 852, (window.innerWidth - 24) / 393);
      scaler.style.transform = "scale(" + s + ")";
    }
    fit();
    window.addEventListener("resize", fit);
  })();
</script>
<script src="app/embed.js"></script>
</body>
</html>
