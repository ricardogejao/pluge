<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pluge — Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="app/pluge-tokens.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    background: #050505;
    background-image: radial-gradient(80% 60% at 50% 0%, #141414 0%, #050505 70%);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }
  #root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .device-scaler { transform-origin: center center; }

  /* iPhone 14 Pro frame */
  .device { position: relative; width: 393px; height: 852px; flex: none; }
  .device .bezel {
    position: absolute; inset: 0; border-radius: 54px; background: #0A0A0A;
    overflow: hidden; box-shadow: 0 0 0 11px #161616, 0 0 0 12px #2c2c2c, 0 40px 120px rgba(0,0,0,.6);
  }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 124px; height: 35px; border-radius: 20px; background: #000; z-index: 40; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-primary); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); z-index: 45; }

  .statusbar { height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px 0 34px; z-index: 20; }
  .statusbar .time { font-size: 15px; font-weight: 600; color: #fff; }
  .statusbar .icons { display: flex; gap: 7px; align-items: center; color: #fff; }

  /* hero */
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 40px; }
  .mark { width: 72px; height: 72px; border-radius: 20px; background: var(--color-primary);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 60px 8px rgba(0,212,106,.25), 0 8px 30px rgba(0,212,106,.25); }
  @media (prefers-reduced-motion: no-preference) { .mark { animation: rise .6s cubic-bezier(.2,0,0,1); } }
  @keyframes rise { 0% { transform: translateY(8px) scale(.92); } 100% { transform: translateY(0) scale(1); } }

  .wordmark { font-size: 42px; font-weight: 700; letter-spacing: -2px; color: #fff; margin-top: 28px; }
  .tagline { font-size: 14px; line-height: 1.5; color: var(--text-tertiary); text-align: center;
    margin-top: 12px; max-width: 230px; }

  /* progress */
  .progress-wrap { flex: none; padding: 0 56px 56px; }
  .progress { height: 3px; border-radius: 3px; background: var(--bg-surface); overflow: hidden; }
  .progress .fill { height: 100%; width: 60%; border-radius: 3px; background: var(--color-primary); }
  @media (prefers-reduced-motion: no-preference) {
    .progress .fill { animation: load 2.4s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes load { 0% { width: 12%; } 60% { width: 60%; } 100% { width: 96%; } }
  }
</style>
</head>
<body>
<div id="root">
  <div class="device-scaler" id="scaler">
    <div class="device">
      <div class="bezel">
        <div class="island"></div>
        <div class="screen">

          <div class="statusbar">
            <span class="time">9:41</span>
            <span class="icons">
              <i class="ti ti-signal-4g" style="font-size:17px"></i>
              <i class="ti ti-wifi" style="font-size:17px"></i>
              <i class="ti ti-battery-3" style="font-size:20px"></i>
            </span>
          </div>

          <div class="hero">
            <div class="mark">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="#000"><path d="M13 2L4.5 13.5H11l-1 8.5 8.5-11.5H12z"></path></svg>
            </div>
            <div class="wordmark">Pluge</div>
            <div class="tagline">Encontre um carregador bem perto de você.</div>
          </div>

          <div class="progress-wrap">
            <div class="progress"><div class="fill"></div></div>
          </div>

        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
</div>
<script>
  (function () {
    var scaler = document.getElementById("scaler");
    function fit() {
      var s = Math.min(1, (window.innerHeight - 24) / 852, (window.innerWidth - 24) / 393);
      scaler.style.transform = "scale(" + s + ")";
    }
    fit();
    window.addEventListener("resize", fit);
  })();
</script>
<script src="app/embed.js"></script>
<script>
  // auto-advance to the map once the splash has "loaded"
  setTimeout(function () { if (window.PlugeGo) PlugeGo("map"); }, 2600);
</script>
</body>
</html>
