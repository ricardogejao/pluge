<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pluge — Cadastrar carregador</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="app/pluge-tokens.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); background: #050505; background-image: radial-gradient(80% 60% at 50% 0%, #141414 0%, #050505 70%); color: var(--text-primary); -webkit-font-smoothing: antialiased; }
  #root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .device-scaler { transform-origin: center center; }
  .device { position: relative; width: 393px; height: 852px; flex: none; }
  .device .bezel { position: absolute; inset: 0; border-radius: 54px; background: #0A0A0A; overflow: hidden; box-shadow: 0 0 0 11px #161616, 0 0 0 12px #2c2c2c, 0 40px 120px rgba(0,0,0,.6); }
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 124px; height: 35px; border-radius: 20px; background: #000; z-index: 40; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-primary); }
  .home-indicator { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); z-index: 45; }

  .topbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 58px 18px 12px; }
  .backbtn { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer; }
  .backbtn i { font-size: 22px; color: #fff; }
  .topbar h1 { font-size: 19px; font-weight: 600; margin: 0; }

  .content { flex: 1; overflow-y: auto; padding: 4px 18px 14px; }
  .content::-webkit-scrollbar { display: none; }
  .lead { font-size: 14px; color: var(--text-secondary); line-height: 1.5; margin: 4px 0 18px; }

  .fieldlbl { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; color: var(--text-tertiary); margin: 16px 0 8px; }
  .input { display: flex; align-items: center; gap: 10px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 15px; }
  .input i { font-size: 18px; color: var(--text-secondary); }
  .input .txt { flex: 1; font-size: 15px; color: #fff; }
  .input .txt.ph { color: var(--text-tertiary); }

  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { font-size: 14px; font-weight: 500; padding: 11px 16px; border-radius: 999px; background: var(--bg-surface); color: var(--text-secondary); border: 1px solid var(--border); }
  .opt.on { background: var(--fill-primary); color: var(--color-primary); border-color: rgba(0,212,106,.4); }

  .two { display: flex; gap: 10px; }
  .two > div { flex: 1; }

  .footer { flex: none; padding: 12px 18px 22px; border-top: 1px solid var(--border); background: var(--bg-primary); }
</style>
</head>
<body>
<div id="root">
  <div class="device-scaler" id="scaler">
    <div class="device">
      <div class="bezel">
        <div class="island"></div>
        <div class="screen">
          <div class="topbar">
            <button class="backbtn" data-nav="back"><i class="ti ti-chevron-left"></i></button>
            <h1>Cadastrar carregador</h1>
          </div>
          <div class="content">
            <div class="lead">Preencha os dados do seu ponto de recarga. Você pode editar tudo depois.</div>

            <div class="fieldlbl">Endereço</div>
            <div class="input"><i class="ti ti-map-pin"></i><span class="txt">Av. José de Souza Campos, 1.247</span></div>

            <div class="fieldlbl">Tipo de plug</div>
            <div class="opts">
              <span class="opt on">Tipo 2</span><span class="opt">CCS</span><span class="opt">CHAdeMO</span>
            </div>

            <div class="two">
              <div>
                <div class="fieldlbl">Potência</div>
                <div class="input"><i class="ti ti-bolt"></i><span class="txt">7,4 kW</span></div>
              </div>
              <div>
                <div class="fieldlbl">Preço / kWh</div>
                <div class="input"><i class="ti ti-currency-real"></i><span class="txt">1,20</span></div>
              </div>
            </div>

            <div class="fieldlbl">Disponibilidade</div>
            <div class="input"><i class="ti ti-calendar-week"></i><span class="txt">Seg–Sex · 08:00 – 18:00</span></div>

            <div class="fieldlbl">Tipo de local</div>
            <div class="opts">
              <span class="opt on">Garagem coberta</span><span class="opt">Quintal</span><span class="opt">Rua</span>
            </div>
          </div>
          <div class="footer">
            <button class="btn btn-primary btn-block btn-lg" data-nav="published"><i class="ti ti-circle-plus"></i>Publicar carregador</button>
          </div>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
  </div>
</div>
<script>
  (function () {
    var scaler = document.getElementById("scaler");
    function fit() { var s = Math.min(1, (window.innerHeight - 24) / 852, (window.innerWidth - 24) / 393); scaler.style.transform = "scale(" + s + ")"; }
    fit(); window.addEventListener("resize", fit);
  })();
</script>
<script src="app/embed.js"></script>
</body>
</html>
